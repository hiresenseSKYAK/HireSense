name: Refresh production jobs

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"

concurrency:
  group: production-job-refresh
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: backend

    env:
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      SUMMARIZE_JOB_DESCRIPTIONS: "false"
      EXTRACT_JOB_SKILLS: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-crawler.txt

      - name: Install lightweight crawler dependencies
        run: python -m pip install -r requirements-crawler.txt

      - name: Diagnose database environment
        shell: bash
        run: |
          python - <<'PY'
          import os
          import hashlib
          import socket

          names = ("DB_HOST", "DB_PORT", "DB_NAME", "DB_USER", "DB_PASSWORD")

          for name in names:
              value = os.environ.get(name)
              print(f"{name}_EXISTS={value is not None and value != ''}")

          host = os.environ.get("DB_HOST", "")

          print(f"DB_HOST_LENGTH={len(host)}")
          print(f"DB_PORT={os.environ.get('DB_PORT')!r}")
          print(f"DB_NAME={os.environ.get('DB_NAME')!r}")
          print(f"DB_USER={os.environ.get('DB_USER')!r}")

          print(
              f"DB_HOST_SHA256="
              f"{hashlib.sha256(host.encode()).hexdigest()}"
          )

          try:
              result = socket.getaddrinfo(
                  host,
                  int(os.environ["DB_PORT"])
              )
              print(
                  f"SECRET_HOST_DNS_OK=True "
                  f"addresses={len(result)}"
              )
          except Exception as e:
              print(
                  f"SECRET_HOST_DNS_OK=False "
                  f"error={type(e).__name__}: {e}"
              )

          expected = "hiresense-mysql-hiresense-capstone.e.aivencloud.com"

          print(
              f"EXPECTED_HOST_SHA256="
              f"{hashlib.sha256(expected.encode()).hexdigest()}"
          )

          try:
              result = socket.getaddrinfo(expected, 10188)
              print(
                  f"EXPECTED_HOST_DNS_OK=True "
                  f"addresses={len(result)}"
              )
          except Exception as e:
              print(
                  f"EXPECTED_HOST_DNS_OK=False "
                  f"error={type(e).__name__}: {e}"
              )
          PY

      - name: Diagnose Aiven DNS
        shell: bash
        working-directory: .
        run: |
          echo "Default resolver:"
          getent hosts hiresense-mysql-hiresense-capstone.e.aivencloud.com || true

          echo "Google DNS:"
          nslookup hiresense-mysql-hiresense-capstone.e.aivencloud.com 8.8.8.8 || true

          echo "Cloudflare DNS:"
          nslookup hiresense-mysql-hiresense-capstone.e.aivencloud.com 1.1.1.1 || true

      - name: Apply additive migrations
        run: python -m database.migrate

      - name: Crawl LinkedIn
        id: crawl_linkedin
        continue-on-error: true
        run: python -m crawler.crawl --source linkedin --limit 150

      - name: Crawl Handshake
        id: crawl_handshake
        continue-on-error: true
        run: python -m crawler.crawl --source handshake --limit 100 --skip-cleanup

      - name: Report source failures
        if: always()
        run: |
          echo "LinkedIn: ${{ steps.crawl_linkedin.outcome }}"
          echo "Handshake: ${{ steps.crawl_handshake.outcome }}"

          if [ "${{ steps.crawl_linkedin.outcome }}" = "failure" ] || \
             [ "${{ steps.crawl_handshake.outcome }}" = "failure" ]; then
            exit 1
          fi
