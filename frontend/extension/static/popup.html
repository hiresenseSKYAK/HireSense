<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HireSense Autofill</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <p class="eyebrow">HireSense</p>
      <h1>Application Autofill</h1>
      <p id="status">Checking for a confirmed profile…</p>
      <button id="fill" type="button" disabled>Fill supported fields</button>
      <button id="clear" type="button" class="secondary">Clear profile</button>
      <p class="note">Fields are filled only after you choose this action. HireSense never submits an application.</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
